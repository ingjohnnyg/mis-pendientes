<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pendientes" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="icon" href="icon.png" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap">
<title>Pendientes</title>
<style>
  :root{
    --bg:#f2f2f3; --surface:#e9e9ea; --ink:#1d1f20; --ink-2:#5d5d60; --ink-3:#7a7a7d;
    --line:rgba(29,31,32,.16); --line-soft:rgba(29,31,32,.10);
    --steel:#5980a6; --steel-900:#1d2d3d; --steel-300:#94bce3;
    --late:#8c2f2f; --late-ink:#f7ecec; --late-soft:#f0d2d2;
    --today:#e0ae4a; --today-ink:#3d2c07;
    --font-h:"Barlow Condensed",system-ui,sans-serif;
    --font-b:"Barlow",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);}
  body{font-family:var(--font-b);color:var(--ink);padding-bottom:env(safe-area-inset-bottom);}
  #app{min-height:100vh;}
  :focus-visible{outline:2px solid var(--steel);outline-offset:2px;}

  /* header */
  .plate{background:var(--steel-900);color:#f2f2f3;padding:calc(env(safe-area-inset-top) + 16px) 20px 14px;
         display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .plate h1{margin:0;font-family:var(--font-h);font-weight:600;font-size:26px;letter-spacing:.14em;text-transform:uppercase;}
  .plate-right{text-align:right;font-size:12px;color:#b9c3cc;display:flex;flex-direction:column;gap:3px;align-items:flex-end;}
  .plate-date{text-transform:capitalize;}
  .plate-counts{font-family:var(--font-h);letter-spacing:.08em;font-size:12px;color:#dfe5e9;}
  .sync-line{display:flex;align-items:center;gap:6px;}
  .dot-status{width:6px;height:6px;border-radius:50%;background:#7c8791;}
  .dot-status.ok{background:#7fae86;} .dot-status.err{background:var(--late);} .dot-status.busy{background:var(--today);}
  .gear{background:none;border:1px solid #3c5164;color:#dfe5e9;width:30px;height:30px;flex:none;font-size:14px;cursor:pointer;}
  .save-warn{margin:0 20px;margin-top:10px;background:var(--late-soft);color:var(--late);border:1px solid var(--late);
             padding:8px 12px;font-size:12.5px;font-weight:600;}

  /* quick capture */
  .capture{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 20px;}
  .capture-input{width:100%;padding:11px 12px;border:1px solid var(--line);background:#fff;font-size:15px;
                 color:var(--ink);font-family:var(--font-b);}
  .capture-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .chip{font-family:var(--font-h);letter-spacing:.06em;text-transform:uppercase;font-size:11px;
       padding:5px 10px;background:#dcdcde;color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;}
  .chip-prio{cursor:pointer;font-family:var(--font-h);}
  .chip-prio[data-level="alta"]{background:var(--late-soft);color:var(--late);border-color:var(--late);}
  .chip-prio[data-level="media"]{background:#fbe9c9;color:#6b4c10;border-color:var(--today);}
  .chip-prio[data-level="baja"]{background:#e2e6e2;color:var(--ink-2);}
  .chip-resp, .chip-fecha{background:transparent;}
  .btn-add{margin-left:auto;background:var(--steel-900);color:#fff;font-family:var(--font-h);letter-spacing:.08em;
           text-transform:uppercase;font-size:12.5px;padding:9px 18px;border:none;cursor:pointer;}

  /* focus row */
  .focus-row{display:grid;grid-template-columns:repeat(4,1fr);margin:0 20px;margin-top:16px;border:1px solid var(--line);}
  .focus-cell{padding:14px 12px;border-right:1px solid var(--line);}
  .focus-cell:last-child{border-right:none;}
  .focus-cell.late{background:var(--late);color:var(--late-ink);}
  .focus-cell.today{background:var(--today);color:var(--today-ink);}
  .focus-cell.paper{background:#fff;}
  .focus-n{font-family:var(--font-h);font-size:44px;line-height:1;font-weight:600;}
  .focus-l{font-family:var(--font-h);letter-spacing:.1em;text-transform:uppercase;font-size:11.5px;margin-top:4px;}
  .focus-sub{font-size:11px;margin-top:6px;opacity:.85;}
  .load-cell{font-size:11px;}
  .load-title{font-family:var(--font-h);letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--ink-2);margin-bottom:8px;}
  .load-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .load-name{width:56px;flex:none;font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .load-bar{flex:1;height:8px;background:var(--line-soft);display:flex;overflow:hidden;}
  .load-bar .seg.late{background:var(--late);}
  .load-bar .seg.open{background:var(--steel-300);}
  .load-total{width:16px;flex:none;font-size:11px;text-align:right;color:var(--ink-2);}
  .load-empty{color:var(--ink-3);font-size:11px;}

  /* columns */
  .columns{display:grid;grid-template-columns:1fr 1fr;margin:0 20px 30px;border:1px solid var(--line);border-top:none;}
  .col{border-right:1px solid var(--line);padding:14px 14px 6px;}
  .col:last-child{border-right:none;}
  .col-title{font-family:var(--font-h);letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--ink);
             margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .subgroup{margin-bottom:14px;}
  .subgroup-head{font-family:var(--font-h);letter-spacing:.08em;text-transform:uppercase;font-size:11px;
                 color:var(--ink-3);margin-bottom:4px;}
  .person-head{display:flex;align-items:center;gap:8px;margin:14px 0 4px;}
  .avatar{width:22px;height:22px;background:var(--steel-900);color:#fff;font-family:var(--font-h);font-size:10px;
         display:flex;align-items:center;justify-content:center;flex:none;}
  .person-name{font-family:var(--font-h);letter-spacing:.05em;font-size:13px;}
  .person-meta{font-size:11px;color:var(--ink-3);}
  .empty-col{color:var(--ink-3);font-size:12px;padding:10px 0;}

  /* row */
  .row{display:grid;grid-template-columns:18px 1fr auto auto;align-items:center;gap:10px;
      padding:10px 0 10px 10px;border-bottom:1px solid var(--line-soft);border-left:3px solid transparent;}
  .row.row-late{border-left-color:var(--late);}
  .row.row-today{border-left-color:var(--today);}
  .row-check{width:15px;height:15px;border:1px solid var(--ink-2);cursor:pointer;display:flex;align-items:center;
             justify-content:center;font-size:10px;color:#fff;background:#fff;}
  .row-check.on{background:var(--steel-900);border-color:var(--steel-900);}
  .row-title{font-size:15px;color:var(--ink);line-height:1.3;}
  .row-title.done{text-decoration:line-through;color:var(--ink-3);}
  .row-meta{font-size:12px;color:var(--ink-3);margin-top:2px;}
  .row-date{font-family:var(--font-b);font-size:11px;padding:4px 9px;border:1px solid var(--line);background:#e7e7ea;
            color:var(--ink-2);white-space:nowrap;cursor:pointer;}
  .row-date.late{background:var(--late);color:var(--late-ink);border-color:var(--late);}
  .row-date.today{background:var(--today);color:var(--today-ink);border-color:var(--today);}
  .date-edit{font-size:11px;padding:3px 5px;border:1px solid var(--steel);}
  .row-del{background:none;border:none;color:var(--ink-3);font-size:17px;padding:2px 6px;opacity:0;transition:opacity .1s;cursor:pointer;}
  .row:hover .row-del{opacity:1;}
  .row-title{cursor:pointer;}

  .row-edit{display:block;padding:10px 8px;border-left:3px solid var(--steel);}
  .edit-texto{width:100%;padding:8px;border:1px solid var(--line);font-size:14px;font-family:var(--font-b);margin-bottom:6px;}
  .edit-fields-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
  .edit-resp{flex:1;min-width:130px;padding:7px;border:1px solid var(--line);font-size:13px;font-family:var(--font-b);}
  .edit-fields-row .date-edit{padding:6px;border:1px solid var(--line);font-size:12px;}
  .edit-actions{display:flex;}

  .scope-chips{display:flex;gap:6px;margin:14px 20px 0;}
  .scope-chip{font-family:var(--font-h);letter-spacing:.06em;text-transform:uppercase;font-size:11.5px;
             padding:7px 12px;background:#fff;border:1px solid var(--line);color:var(--ink-2);cursor:pointer;}
  .scope-chip.active{background:var(--steel-900);color:#fff;border-color:var(--steel-900);}

  .loading{padding:40px;text-align:center;color:var(--ink-3);font-size:13px;}

  .modal-back{position:fixed;inset:0;background:rgba(20,22,19,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;}
  .modal{background:#fff;width:100%;max-width:480px;padding:20px 20px calc(24px + env(safe-area-inset-bottom));}
  .modal h2{margin:0 0 4px;font-family:var(--font-h);letter-spacing:.04em;font-size:19px;}
  .modal p{margin:0 0 14px;font-size:12.5px;color:var(--ink-3);line-height:1.4;}
  .modal label{display:block;font-family:var(--font-h);letter-spacing:.06em;text-transform:uppercase;font-size:10px;
              color:var(--ink-3);margin:10px 0 4px;}
  .modal input{width:100%;padding:9px;border:1px solid var(--line);font-size:14px;font-family:var(--font-b);}
  .modal .btn-add{margin-top:14px;margin-left:0;width:100%;justify-content:center;text-align:center;}
  .modal .err{background:var(--late-soft);color:var(--late);font-size:12px;padding:8px 10px;margin-top:10px;}

  @media (max-width:760px){
    .focus-row{grid-template-columns:repeat(3,1fr);}
    .load-cell{display:none;}
    .columns{grid-template-columns:1fr;}
    .col{border-right:none;border-bottom:1px solid var(--line);}
    .col:last-child{border-bottom:none;}
    .row-del{opacity:1;}
    .btn-add{width:100%;margin-left:0;padding:13px;}
  }
</style>
</head>
<body>
<div id="app"><div class="loading">Cargando…</div></div>

<script>
(function(){
  const DATA_PATH = 'data.json';
  const CFG_KEY = 'pendientes-gh-cfg';
  const CACHE_KEY = 'pendientes-cache';

  let cfg = null;
  try{ cfg = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); }catch(e){ cfg = null; }

  let items = [];
  let sha = null;
  let filter = 'all';
  let scope = 'all'; // all | mine | delegated
  let editingDate = new Set();
  let editingItem = new Set();
  let loaded = false;
  let showSettings = !cfg;
  let syncStatus = 'idle'; // idle | busy | ok | err
  let syncError = '';
  let saving = false;
  let pendingSave = false;
  let quickPriority = 'media';

  const BUCKET_LABELS = {vencido:'Vencido',hoy:'Vence hoy',semana:'Esta semana',proximo:'Próximo',sinfecha:'Sin fecha',cerrado:'Cerrado'};
  const BUCKET_ORDER = ['vencido','hoy','semana','proximo','sinfecha','cerrado'];

  function todayISO(){ const d=new Date(); d.setHours(0,0,0,0); return d.toISOString().slice(0,10); }

  function bucketOf(it){
    if(it.estatus==='cerrado') return 'cerrado';
    if(!it.fecha) return 'sinfecha';
    const today = todayISO();
    const in7 = new Date(); in7.setDate(in7.getDate()+7);
    const in7ISO = in7.toISOString().slice(0,10);
    if(it.fecha < today) return 'vencido';
    if(it.fecha === today) return 'hoy';
    if(it.fecha <= in7ISO) return 'semana';
    return 'proximo';
  }

  function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function utf8ToB64(str){ return btoa(String.fromCharCode(...new TextEncoder().encode(str))); }
  function b64ToUtf8(b64){ return new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g,'')), c=>c.charCodeAt(0))); }

  const DATA_BRANCH = 'data';
  function apiUrl(){ return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${DATA_PATH}?ref=${DATA_BRANCH}`; }
  function apiHeaders(extra){
    return Object.assign({ Authorization: `token ${cfg.token}`, Accept: 'application/vnd.github+json' }, extra||{});
  }

  async function ghLoad(){
    const res = await fetch(apiUrl(), { headers: apiHeaders() });
    if(res.status === 404){ return { items: [], sha: null }; }
    if(!res.ok) throw new Error('GET '+res.status);
    const json = await res.json();
    const text = b64ToUtf8(json.content || '');
    return { items: text ? JSON.parse(text) : [], sha: json.sha };
  }

  async function ghSave(list, prevSha){
    const body = { message: 'Actualizar pendientes', content: utf8ToB64(JSON.stringify(list, null, 2)), branch: DATA_BRANCH };
    if(prevSha) body.sha = prevSha;
    const res = await fetch(apiUrl(), {
      method: 'PUT',
      headers: apiHeaders({'Content-Type':'application/json'}),
      body: JSON.stringify(body)
    });
    if(res.status === 409){ throw {conflict:true}; }
    if(!res.ok){ const t = await res.text(); throw new Error('PUT '+res.status+': '+t); }
    const json = await res.json();
    return json.content.sha;
  }

  function cacheLocal(){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({items, sha})); }catch(e){}
  }

  async function init(){
    if(!cfg){ loaded = true; render(); return; }
    try{
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
      if(cached){ items = cached.items; sha = cached.sha; }
    }catch(e){}
    loaded = true;
    render();
    await refreshFromRemote(true);
  }

  async function refreshFromRemote(initial){
    if(!cfg || saving) return;
    syncStatus = 'busy'; if(!initial) render();
    try{
      const r = await ghLoad();
      items = initial ? r.items : mergeItems(r.items, items);
      sha = r.sha;
      cacheLocal();
      syncStatus = 'ok'; syncError='';
      render();
    }catch(e){
      syncStatus = 'err'; syncError = 'No se pudo conectar con GitHub. Revisando de nuevo…';
      render();
    }
  }

  let saveTimer = null;
  function scheduleSave(){
    cacheLocal();
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 500);
  }

  async function doSave(){
    if(!cfg) return;
    saving = true; syncStatus='busy'; render();
    try{
      const newSha = await ghSave(items, sha);
      sha = newSha;
      cacheLocal();
      syncStatus = 'ok'; syncError='';
    }catch(e){
      if(e && e.conflict){
        try{
          const r = await ghLoad();
          items = mergeItems(r.items, items);
          sha = r.sha;
          const newSha = await ghSave(items, sha);
          sha = newSha; cacheLocal();
          syncStatus='ok'; syncError='';
        }catch(e2){
          syncStatus='err'; syncError='Conflicto al guardar. Vuelve a intentar en un momento.';
        }
      } else {
        syncStatus='err'; syncError='No se pudo guardar en GitHub. Reintentando…';
        saveTimer = setTimeout(doSave, 4000);
      }
    }
    saving = false;
    render();
  }

  function addItem(texto, responsable, prioridad, fecha){
    items.unshift({ id:'p'+Date.now()+Math.random().toString(36).slice(2,7), texto, responsable, prioridad, fecha, estatus:'abierto', creado: todayISO(), actualizado: Date.now() });
    scheduleSave(); render();
  }
  function toggleClose(id){
    const it = items.find(i=>i.id===id);
    if(it){ it.estatus = it.estatus==='cerrado' ? 'abierto' : 'cerrado'; it.actualizado = Date.now(); scheduleSave(); render(); }
  }
  function removeItem(id){ items = items.filter(i=>i.id!==id); scheduleSave(); render(); }
  function updateFecha(id, nuevaFecha){
    const it = items.find(i=>i.id===id);
    if(it){ it.fecha = nuevaFecha; it.actualizado = Date.now(); scheduleSave(); }
  }
  function updateTexto(id, nuevoTexto){
    const it = items.find(i=>i.id===id);
    if(it && nuevoTexto.trim()){ it.texto = nuevoTexto.trim(); it.actualizado = Date.now(); scheduleSave(); render(); }
  }
  function updateResponsable(id, nuevoResp){
    const it = items.find(i=>i.id===id);
    if(it){ it.responsable = nuevoResp.trim(); it.actualizado = Date.now(); scheduleSave(); render(); }
  }
  function updatePrioridad(id, nueva){
    const it = items.find(i=>i.id===id);
    if(it){ it.prioridad = nueva; it.actualizado = Date.now(); scheduleSave(); render(); }
  }

  function mergeItems(remote, local){
    const map = {};
    (remote||[]).forEach(it=>{ map[it.id] = it; });
    (local||[]).forEach(it=>{
      const ex = map[it.id];
      if(!ex || (it.actualizado||0) >= (ex.actualizado||0)) map[it.id] = it;
    });
    return Object.values(map);
  }

  async function connect(owner, repo, token){
    cfg = { owner: owner.trim(), repo: repo.trim(), token: token.trim() };
    try{
      const r = await ghLoad();
      items = r.items; sha = r.sha;
      if(r.sha === null){
        const newSha = await ghSave(items.length ? items : [], null);
        sha = newSha;
      }
      localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
      cacheLocal();
      showSettings = false;
      syncStatus='ok'; syncError='';
      render();
    }catch(e){
      throw e;
    }
  }

  /* ---------- visual layer ---------- */

  function stripAccents(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

  const WD_NAMES = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
  const MESES = {ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,oct:9,nov:10,dic:11};

  function parseQuick(raw){
    let text = raw;
    let responsable = '';
    const mMention = text.match(/@(\S+)/);
    if(mMention){ responsable = mMention[1]; text = text.replace(mMention[0], '').trim(); }

    let fecha = '';
    const todayD = new Date(); todayD.setHours(0,0,0,0);
    const lowerNorm = stripAccents(text.toLowerCase());

    if(/\bhoy\b/.test(lowerNorm)){
      fecha = todayISO();
      text = text.replace(/\bhoy\b/i,'').trim();
    } else if(/\bmanana\b/.test(lowerNorm)){
      const d = new Date(todayD); d.setDate(d.getDate()+1);
      fecha = d.toISOString().slice(0,10);
      text = text.replace(/\bma(ñ|n)ana\b/i,'').trim();
    } else {
      let matchedWD = -1;
      for(let i=0;i<7;i++){
        const re = new RegExp('\\b'+WD_NAMES[i]+'\\b');
        if(re.test(lowerNorm)){ matchedWD = i; text = text.replace(new RegExp('\\b'+WD_NAMES[i]+'\\b','i'), '').trim(); break; }
      }
      if(matchedWD>=0){
        const d = new Date(todayD);
        const diff = (matchedWD - d.getDay() + 7) % 7;
        d.setDate(d.getDate()+diff);
        fecha = d.toISOString().slice(0,10);
      } else {
        const mMonth = lowerNorm.match(/\b(\d{1,2})\s*(?:de\s*)?(ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)[a-z]*\b/);
        if(mMonth){
          const day = parseInt(mMonth[1],10);
          const month = MESES[mMonth[2]];
          let year = todayD.getFullYear();
          let cand = new Date(year, month, day);
          if(cand < todayD) year++;
          cand = new Date(year, month, day);
          fecha = cand.toISOString().slice(0,10);
          const reRemove = new RegExp(mMonth[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
          text = text.replace(reRemove, '').trim();
        } else {
          const mNum = lowerNorm.match(/\b(\d{1,2})[\/\-](\d{1,2})\b/);
          if(mNum){
            const day = parseInt(mNum[1],10), month = parseInt(mNum[2],10)-1;
            let year = todayD.getFullYear();
            let cand = new Date(year, month, day);
            if(cand < todayD) year++;
            cand = new Date(year, month, day);
            fecha = cand.toISOString().slice(0,10);
            text = text.replace(mNum[0],'').trim();
          }
        }
      }
    }
    text = text.replace(/\s{2,}/g,' ').trim();
    return {texto:text, responsable, fecha};
  }

  function dateBadge(fecha){
    if(!fecha) return {text:'sin fecha', cls:''};
    const today = todayISO();
    if(fecha < today){
      const diff = Math.round((new Date(today+'T00:00:00') - new Date(fecha+'T00:00:00'))/86400000);
      return {text:'+'+diff+' días', cls:'late'};
    }
    if(fecha === today) return {text:'hoy', cls:'today'};
    const d = new Date(fecha+'T00:00:00');
    const wd = ['dom','lun','mar','mié','jue','vie','sáb'][d.getDay()];
    return {text: wd+' '+d.getDate(), cls:''};
  }

  function onQuickInput(){
    const raw = document.getElementById('capture-input').value;
    const parsed = parseQuick(raw);
    const respEl = document.getElementById('chip-resp');
    const fechaEl = document.getElementById('chip-fecha');
    if(respEl) respEl.textContent = parsed.responsable ? '@'+parsed.responsable : 'sin delegar';
    if(fechaEl){
      const b = parsed.fecha ? dateBadge(parsed.fecha) : {text:'sin fecha'};
      fechaEl.textContent = b.text;
    }
  }

  function onQuickAdd(){
    const raw = document.getElementById('capture-input').value.trim();
    if(!raw) return;
    const parsed = parseQuick(raw);
    if(!parsed.texto) return;
    addItem(parsed.texto, parsed.responsable, quickPriority, parsed.fecha);
    document.getElementById('capture-input').value = '';
    quickPriority = 'media';
    document.getElementById('capture-input').focus();
  }

  function editRowHtml(it){
    return `<div class="row row-edit">
      <input type="text" class="edit-texto" data-id="${it.id}" value="${esc(it.texto)}" placeholder="Qué hay que hacer" />
      <div class="edit-fields-row">
        <input type="text" class="edit-resp" data-id="${it.id}" value="${esc(it.responsable||'')}" placeholder="Delegado a (opcional)" />
        <button class="chip chip-prio" data-id="${it.id}" data-action="rowprio" data-level="${it.prioridad}">${it.prioridad}</button>
        <input type="date" class="date-edit" data-id="${it.id}" value="${it.fecha||''}" />
      </div>
      <div class="edit-actions">
        <button class="btn-add" data-id="${it.id}" data-action="closeedit" style="margin-left:0;">Listo</button>
      </div>
    </div>`;
  }

  function rowHtml(it){
    if(editingItem.has(it.id)) return editRowHtml(it);
    const b = bucketOf(it);
    const badge = dateBadge(it.fecha);
    const prioridadLabel = {alta:'Alta prioridad', media:'Prioridad media', baja:'Baja prioridad'}[it.prioridad] || '';
    const dateArea = editingDate.has(it.id)
      ? `<input type="date" class="date-edit" data-id="${it.id}" value="${it.fecha||''}" />`
      : `<button class="row-date ${badge.cls}" data-id="${it.id}" data-action="editdate">${badge.text}</button>`;
    return `<div class="row ${b==='vencido'?'row-late':b==='hoy'?'row-today':''}">
      <div class="row-check ${it.estatus==='cerrado'?'on':''}" data-id="${it.id}" data-action="toggle">${it.estatus==='cerrado'?'✓':''}</div>
      <div class="row-body">
        <div class="row-title ${it.estatus==='cerrado'?'done':''}" data-id="${it.id}" data-action="edit" title="Editar">${esc(it.texto)}</div>
        <div class="row-meta">${prioridadLabel}</div>
      </div>
      ${dateArea}
      <button class="row-del" data-id="${it.id}" data-action="del" title="Eliminar">×</button>
    </div>`;
  }

  function sortByUrgencia(list){
    const rank = {vencido:0, hoy:1, semana:2, proximo:3, sinfecha:4};
    return list.slice().sort((a,c)=>{
      const ra = rank[bucketOf(a)], rc = rank[bucketOf(c)];
      if(ra !== rc) return ra - rc;
      return (a.fecha||'9999').localeCompare(c.fecha||'9999');
    });
  }

  function miasHtml(list){
    const mias = sortByUrgencia(list.filter(it=>!it.responsable));
    if(!mias.length) return `<div class="empty-col">Sin pendientes propios abiertos.</div>`;
    const groups = {};
    mias.forEach(it=>{ const b=bucketOf(it); (groups[b]=groups[b]||[]).push(it); });
    return BUCKET_ORDER.filter(b=>b!=='cerrado').map(b=>{
      if(!groups[b] || !groups[b].length) return '';
      return `<div class="subgroup">
        <div class="subgroup-head">${BUCKET_LABELS[b]} (${groups[b].length})</div>
        ${groups[b].map(rowHtml).join('')}
      </div>`;
    }).join('');
  }

  function delegadasHtml(list){
    const del = list.filter(it=>it.responsable);
    if(!del.length) return `<div class="empty-col">No has delegado nada todavía. Usa @nombre al capturar.</div>`;
    const byPerson = {};
    del.forEach(it=>{ (byPerson[it.responsable]=byPerson[it.responsable]||[]).push(it); });
    const personas = Object.keys(byPerson).sort();
    return personas.map(p=>{
      const list2 = sortByUrgencia(byPerson[p]);
      const vencidas = list2.filter(it=>bucketOf(it)==='vencido').length;
      const initials = p.slice(0,2).toUpperCase();
      return `<div class="person-head">
        <div class="avatar">${esc(initials)}</div>
        <div><div class="person-name">${esc(p)}</div><div class="person-meta">${vencidas} vencida${vencidas===1?'':'s'} · ${list2.length} abierta${list2.length===1?'':'s'}</div></div>
      </div>
      ${list2.map(rowHtml).join('')}`;
    }).join('');
  }

  function loadCellHtml(allOpen){
    const perPersona = {};
    allOpen.forEach(it=>{
      if(!it.responsable) return;
      perPersona[it.responsable] = perPersona[it.responsable] || {vencido:0,total:0};
      perPersona[it.responsable].total++;
      if(bucketOf(it)==='vencido') perPersona[it.responsable].vencido++;
    });
    const personas = Object.keys(perPersona).sort((a,b)=>perPersona[b].total-perPersona[a].total);
    if(!personas.length) return `<div class="load-title">Carga por persona</div><div class="load-empty">Sin delegadas</div>`;
    const maxTotal = Math.max(1, ...personas.map(p=>perPersona[p].total));
    const rows = personas.map(p=>{
      const {vencido,total} = perPersona[p];
      const late = (vencido/maxTotal*100);
      const open = ((total-vencido)/maxTotal*100);
      return `<div class="load-row">
        <div class="load-name">${esc(p)}</div>
        <div class="load-bar"><span class="seg late" style="width:${late}%"></span><span class="seg open" style="width:${open}%"></span></div>
        <div class="load-total">${total}</div>
      </div>`;
    }).join('');
    return `<div class="load-title">Carga por persona</div>${rows}`;
  }

  function render(){
    const app = document.getElementById('app');
    if(!loaded){ app.innerHTML = '<div class="loading">Cargando…</div>'; return; }

    if(showSettings){
      app.innerHTML = settingsHtml();
      wireSettings();
      return;
    }

    const open = items.filter(it=>it.estatus!=='cerrado');
    const closedCount = items.length - open.length;
    const counts = {vencido:0, hoy:0, semana:0};
    open.forEach(it=>{
      const b = bucketOf(it);
      if(b==='vencido') counts.vencido++;
      if(b==='hoy') counts.hoy++;
      if(b==='semana') counts.semana++;
    });

    let scopedOpen = open;
    if(scope==='mine') scopedOpen = open.filter(it=>!it.responsable);
    else if(scope==='delegated') scopedOpen = open.filter(it=>!!it.responsable);

    const vencidoMios = open.filter(it=>!it.responsable && bucketOf(it)==='vencido').length;
    const vencidoDeleg = open.filter(it=>it.responsable && bucketOf(it)==='vencido').length;

    const statusDot = syncStatus==='ok' ? 'ok' : syncStatus==='busy' ? 'busy' : syncStatus==='err' ? 'err' : '';
    const statusTxt = syncStatus==='ok' ? 'Sincronizado' : syncStatus==='busy' ? 'Sincronizando…' : syncStatus==='err' ? 'Sin conexión' : '';
    const longDate = new Date().toLocaleDateString('es-MX',{weekday:'long', day:'numeric', month:'long'});

    app.innerHTML = `
      <div class="plate">
        <h1>Pendientes</h1>
        <div class="plate-right">
          <div class="plate-date">${longDate}</div>
          <div class="sync-line"><span class="dot-status ${statusDot}"></span>${statusTxt}</div>
          <div class="plate-counts">${open.length} ABIERTOS / ${closedCount} CERRADOS</div>
        </div>
        <button class="gear" id="btn-settings" title="Configuración" style="position:absolute;top:10px;right:10px;">⚙</button>
      </div>
      ${syncStatus==='err' ? `<div class="save-warn">${syncError}</div>` : ''}

      <div class="capture">
        <input type="text" id="capture-input" class="capture-input" placeholder="Escribe un pendiente… usa @persona y una fecha (hoy, lunes, 14 sep)" />
        <div class="capture-row">
          <span class="chip chip-resp" id="chip-resp">sin delegar</span>
          <button class="chip chip-prio" id="chip-prio" data-level="${quickPriority}">${quickPriority}</button>
          <span class="chip chip-fecha" id="chip-fecha">sin fecha</span>
          <button class="btn-add" id="btn-add">Agregar</button>
        </div>
      </div>

      <div class="focus-row">
        <div class="focus-cell late">
          <div class="focus-n">${counts.vencido}</div>
          <div class="focus-l">Vencido</div>
          <div class="focus-sub">${vencidoMios} mía${vencidoMios===1?'':'s'} · ${vencidoDeleg} delegada${vencidoDeleg===1?'':'s'}</div>
        </div>
        <div class="focus-cell today">
          <div class="focus-n">${counts.hoy}</div>
          <div class="focus-l">Vence hoy</div>
        </div>
        <div class="focus-cell paper">
          <div class="focus-n" style="color:var(--ink)">${counts.semana}</div>
          <div class="focus-l" style="color:var(--ink-2)">Esta semana</div>
        </div>
        <div class="focus-cell paper load-cell">${loadCellHtml(open)}</div>
      </div>

      <div class="scope-chips">
        <button class="scope-chip ${scope==='all'?'active':''}" data-scope="all">Todo</button>
        <button class="scope-chip ${scope==='mine'?'active':''}" data-scope="mine">Mías</button>
        <button class="scope-chip ${scope==='delegated'?'active':''}" data-scope="delegated">Delegadas</button>
      </div>

      <div class="columns">
        ${scope!=='delegated' ? `<div class="col"><div class="col-title">Mías (${open.filter(it=>!it.responsable).length})</div>${miasHtml(scopedOpen.filter(it=>!it.responsable))}</div>` : ''}
        ${scope!=='mine' ? `<div class="col"><div class="col-title">Delegadas (${open.filter(it=>it.responsable).length})</div>${delegadasHtml(scopedOpen.filter(it=>it.responsable))}</div>` : ''}
      </div>
    `;

    document.getElementById('btn-settings').addEventListener('click', ()=>{ showSettings=true; render(); });
    document.getElementById('btn-add').addEventListener('click', onQuickAdd);
    const inp = document.getElementById('capture-input');
    inp.addEventListener('input', onQuickInput);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') onQuickAdd(); });
    document.getElementById('chip-prio').addEventListener('click', ()=>{
      quickPriority = quickPriority==='alta' ? 'media' : quickPriority==='media' ? 'baja' : 'alta';
      render();
      document.getElementById('capture-input').focus();
    });
    document.querySelectorAll('.scope-chip').forEach(el=>{
      el.addEventListener('click', ()=>{ scope = el.getAttribute('data-scope'); render(); });
    });
  }

  function settingsHtml(){
    return `<div class="modal-back"><div class="modal">
      <h2>Conectar con GitHub</h2>
      <p>Estos datos se guardan solo en este dispositivo. Se usan para leer y escribir tu lista de pendientes en tu repositorio.</p>
      <label>Usuario de GitHub</label>
      <input type="text" id="cfg-owner" placeholder="tu-usuario" value="${cfg&&cfg.owner?esc(cfg.owner):''}" />
      <label>Nombre del repositorio</label>
      <input type="text" id="cfg-repo" placeholder="mis-pendientes" value="${cfg&&cfg.repo?esc(cfg.repo):''}" />
      <label>Token de acceso</label>
      <input type="password" id="cfg-token" placeholder="ghp_..." value="${cfg&&cfg.token?esc(cfg.token):''}" />
      <div id="cfg-err"></div>
      <button class="btn-add" id="btn-connect">Conectar</button>
      ${cfg ? `<button class="btn-add" id="btn-cancel" style="background:#dcdcde;color:var(--ink);margin-top:8px;">Cancelar</button>` : ''}
    </div></div>`;
  }

  function wireSettings(){
    document.getElementById('btn-connect').addEventListener('click', async ()=>{
      const owner = document.getElementById('cfg-owner').value;
      const repo = document.getElementById('cfg-repo').value;
      const token = document.getElementById('cfg-token').value;
      const errEl = document.getElementById('cfg-err');
      if(!owner || !repo || !token){ errEl.innerHTML = '<div class="err">Llena los tres campos.</div>'; return; }
      errEl.innerHTML = '<div class="err" style="background:var(--steel-300);color:var(--steel-900);">Conectando…</div>';
      try{
        await connect(owner, repo, token);
      }catch(e){
        errEl.innerHTML = '<div class="err">No se pudo conectar. Revisa el usuario, el nombre del repositorio y que el token tenga permiso de Contents (Read and write).</div>';
      }
    });
    const cancelBtn = document.getElementById('btn-cancel');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ showSettings=false; render(); });
  }

  document.addEventListener('click', function(e){
    const t = e.target;
    if(t.getAttribute && t.getAttribute('data-action')==='toggle') toggleClose(t.getAttribute('data-id'));
    if(t.getAttribute && t.getAttribute('data-action')==='edit'){
      editingItem.add(t.getAttribute('data-id'));
      render();
      const inp = document.querySelector('.edit-texto');
      if(inp){ inp.focus(); inp.select(); }
    }
    if(t.getAttribute && t.getAttribute('data-action')==='closeedit'){
      editingItem.delete(t.getAttribute('data-id'));
      render();
    }
    if(t.getAttribute && t.getAttribute('data-action')==='rowprio'){
      const id = t.getAttribute('data-id');
      const it = items.find(i=>i.id===id);
      if(it){
        const order = ['alta','media','baja'];
        const next = order[(order.indexOf(it.prioridad)+1)%3];
        updatePrioridad(id, next);
      }
    }
    if(t.getAttribute && t.getAttribute('data-action')==='editdate'){
      editingDate.add(t.getAttribute('data-id'));
      render();
      const inp = document.querySelector('.date-edit');
      if(inp && inp.showPicker){ try{ inp.showPicker(); }catch(e){} }
    }
    if(t.getAttribute && t.getAttribute('data-action')==='del'){
      const it = items.find(i=>i.id===t.getAttribute('data-id'));
      const nombre = it ? it.texto : 'este pendiente';
      if(window.confirm(`¿Eliminar "${nombre}"? Esta acción no se puede deshacer.`)){
        removeItem(t.getAttribute('data-id'));
      }
    }
  });
  document.addEventListener('change', function(e){
    const t = e.target;
    if(t.classList && t.classList.contains('date-edit')){
      const id = t.getAttribute('data-id');
      updateFecha(id, t.value);
      editingDate.delete(id);
      render();
    }
  });
  document.addEventListener('blur', function(e){
    const t = e.target;
    if(t.classList && t.classList.contains('date-edit') && editingDate.has(t.getAttribute('data-id'))){
      editingDate.delete(t.getAttribute('data-id'));
      render();
    }
    if(t.classList && t.classList.contains('edit-texto')){
      updateTexto(t.getAttribute('data-id'), t.value);
    }
    if(t.classList && t.classList.contains('edit-resp')){
      updateResponsable(t.getAttribute('data-id'), t.value);
    }
  }, true);
  document.addEventListener('keydown', function(e){
    const t = e.target;
    if(e.key==='Enter' && t.classList && (t.classList.contains('edit-texto') || t.classList.contains('edit-resp'))){
      e.preventDefault();
      t.blur();
    }
  });
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') refreshFromRemote(); });
  window.addEventListener('focus', ()=>refreshFromRemote());

  init();
})();
</script>
</body>
</html>
